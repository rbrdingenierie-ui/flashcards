<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes flashcards — Apprendre à apprendre</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-soft: #4A5C82;
    --gold: #B08D57;
    --orange: #E0591F;
    --teal: #168F7F;
    --teal-soft: #E3F3F1;
    --rouge: #C0392B;
    --rouge-soft: #FBE5E2;
    --bg: #F7F8FA;
    --white: #FFFFFF;
    --track: #E4E8EE;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); font-family: Arial, Helvetica, sans-serif; color: var(--navy); }
  body { display:flex; justify-content:center; padding: 32px 16px 60px; }
  .page { width:100%; max-width: 620px; }

  header { text-align:center; margin-bottom: 18px; }
  header h1 { font-size: clamp(22px, 5vw, 28px); margin: 0 0 6px 0; }
  header p { font-size: 14px; color: var(--navy-soft); margin:0; }

  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--navy) !important;
    outline-offset: 2px;
  }

  /* ---------- Barre de progression ---------- */
  .progress-row {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px; font-size:13px; color: var(--navy-soft); font-weight:700;
  }
  .progress-bar { flex:1; height:8px; background:var(--track); border-radius:999px; margin: 0 12px; overflow:hidden; }
  .progress-bar-fill { height:100%; background: var(--teal); border-radius:999px; transition: width 0.25s ease; }

  .stats-row {
    display:flex; justify-content:center; gap: 18px; margin-bottom: 20px; font-size:13px;
  }
  .stats-row .stat { display:flex; align-items:center; gap:6px; color: var(--navy-soft); font-weight:700; }
  .stats-row .dot { width:10px; height:10px; border-radius:50%; }

  /* ---------- Carte retournable ---------- */
  .card-zone { perspective: 1600px; margin-bottom: 20px; }
  .card {
    position:relative; width:100%; min-height: 260px;
    transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:20px; padding:32px 28px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    box-shadow: 0 8px 24px rgba(31,56,100,0.12);
  }
  .card-face.recto { background: var(--white); border: 2px solid var(--gold); }
  .card-face.verso { background: linear-gradient(135deg, #1C8577, #0F6B5F); color:#FFFFFF; transform: rotateY(180deg); }
  .card-label {
    position:absolute; top:16px; left:20px; font-size:11px; font-weight:800;
    letter-spacing:1.5px; text-transform:uppercase; opacity:0.55;
  }
  .card-text { font-size: 19px; font-weight:700; line-height:1.45; }
  .card-face.verso .card-text { font-weight:400; font-size:17px; }
  .card-hint { position:absolute; bottom:14px; font-size:12px; opacity:0.5; font-style:italic; }

  .mastered-badge {
    position:absolute; top:14px; right:16px; font-size:18px;
  }

  /* ---------- Auto-evaluation ---------- */
  .assess-row { display:flex; gap:12px; margin-bottom: 16px; }
  .assess-row button {
    flex:1; font-family:inherit; font-size:14.5px; font-weight:700; padding:14px; border-radius:14px;
    cursor:pointer; border:2px solid transparent;
  }
  .btn-revoir { background: var(--rouge-soft); color: var(--rouge); }
  .btn-revoir:hover { border-color: var(--rouge); }
  .btn-connu { background: var(--teal-soft); color: var(--teal); }
  .btn-connu:hover { border-color: var(--teal); }
  .assess-row button:disabled { opacity:0.4; cursor:not-allowed; }

  /* ---------- Navigation ---------- */
  .nav-row { display:flex; align-items:center; gap:10px; margin-bottom: 20px; }
  .nav-btn {
    font-family:inherit; font-size:14px; font-weight:700; color:var(--navy);
    background: var(--white); border:2px solid var(--track); border-radius:12px;
    padding:12px 16px; cursor:pointer; flex-shrink:0;
  }
  .nav-btn:hover { border-color: var(--navy-soft); }
  .nav-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .flip-btn {
    flex:1; font-family:inherit; font-size:14px; font-weight:700; color:#FFFFFF;
    background: var(--navy); border:none; border-radius:12px; padding:12px; cursor:pointer;
  }
  .flip-btn:hover { filter:brightness(1.15); }

  .actions { display:flex; gap:12px; }
  .actions > * { flex:1; }
  .btn-secondary {
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--navy-soft);
    background:var(--white); border:2px solid var(--track); border-radius:12px; padding:11px; cursor:pointer;
  }
  .btn-secondary:hover { border-color: var(--navy-soft); color: var(--navy); }
  .btn-secondary.danger:hover { border-color:#C0392B; color:#C0392B; }
  .btn-secondary.active { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }

  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .empty-msg { text-align:center; padding: 40px 20px; color: var(--navy-soft); font-size:15px; }

  footer { text-align:center; font-size:12px; color:var(--navy-soft); margin-top: 22px; }

  @media (max-width: 420px) {
    .assess-row, .actions { flex-direction: column; }
    .assess-row > *:not(:last-child), .actions > *:not(:last-child) { margin-bottom: 8px; }
  }

  @media print {
    body { display:block; padding:20px; }
    header, .progress-row, .stats-row, .card-zone, .assess-row, .nav-row, .actions { display:none !important; }
    .print-all { display:block !important; }
  }
  .print-all { display:none; }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>🗂️ Mes flashcards</h1>
    <p>Cliquez sur la carte pour la retourner, puis évaluez-vous.</p>
  </header>

  <div class="progress-row">
    <span id="progressLabel">Carte 1/23</span>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <span id="progressPct">0%</span>
  </div>

  <div class="stats-row">
    <div class="stat"><span class="dot" style="background:var(--teal)"></span><span id="countConnu">0</span> connues</div>
    <div class="stat"><span class="dot" style="background:var(--rouge)"></span><span id="countRevoir">0</span> à revoir</div>
    <div class="stat"><span class="dot" style="background:var(--track)"></span><span id="countRestant">23</span> non vues</div>
  </div>

  <div class="card-zone">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Carte, appuyez sur Entrée ou Espace pour retourner">
      <div class="card-face recto">
        <span class="card-label">Question</span>
        <span class="mastered-badge" id="masteredBadge"></span>
        <div class="card-text" id="rectoText"></div>
        <span class="card-hint">Cliquez pour voir la réponse</span>
      </div>
      <div class="card-face verso">
        <span class="card-label">Réponse</span>
        <div class="card-text" id="versoText"></div>
      </div>
    </div>
  </div>

  <div class="assess-row">
    <button class="btn-revoir" id="btnRevoir">😕 À revoir</button>
    <button class="btn-connu" id="btnConnu">😊 Je savais</button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="Carte précédente">← Précédent</button>
    <button class="flip-btn" id="flipBtn">Retourner la carte</button>
    <button class="nav-btn" id="nextBtn" aria-label="Carte suivante">Suivant →</button>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="shuffleBtn">🔀 Mélanger</button>
    <button class="btn-secondary" id="filterBtn">🎯 Cartes à revoir seulement</button>
    <button class="btn-secondary danger" id="resetBtn">↺ Réinitialiser</button>
  </div>

  <div class="print-all" id="printAll"></div>

  <div class="sr-only" id="liveAnnounce" aria-live="polite"></div>

  <footer>Benjamin RICHARD - Tous droits réservés</footer>
</div>

<script>
const CARDS_DATA = [{"recto": "Quels sont les 5 types de mémoire mobilisés pour apprendre ?", "verso": "Visuelle, auditive, sémantique, de travail, à long terme."}, {"recto": "Comment la mémoire évolue-t-elle avec l'entraînement ?", "verso": "Elle se renforce, comme un muscle."}, {"recto": "Qu'est-ce que la métacognition ?", "verso": "Réfléchir sur sa propre façon de penser et d'apprendre."}, {"recto": "Quelles questions se poser pour être métacognitif ?", "verso": "Avant : que sais-je, quelle méthode ? Pendant : est-ce que je comprends ? Après : ai-je réussi, où me suis-je trompé ?"}, {"recto": "Qu'est-ce qu'apprendre par analogie ?", "verso": "Comparer une notion nouvelle à une notion connue, en cherchant ressemblances ET différences."}, {"recto": "Qu'est-ce que catégoriser ?", "verso": "Ranger une information nouvelle dans une ou plusieurs catégories déjà connues."}, {"recto": "Une exception invalide-t-elle une catégorie ?", "verso": "Non : elle l'enrichit et la nuance, elle ne l'invalide pas."}, {"recto": "Quelles sont les 3 étapes du processus de mémorisation ?", "verso": "Encodage (convertir), stockage (conserver), récupération (retrouver)."}, {"recto": "Que se passe-t-il dans le cerveau quand on apprend ?", "verso": "Les neurones forment des réseaux ; plus on les réactive, plus ils se renforcent."}, {"recto": "Quels sont les 4 leviers pour bien mémoriser ?", "verso": "Attention, charge de travail maîtrisée, réactivation régulière, hygiène de vie."}, {"recto": "Comment évolue l'oubli dans le temps ?", "verso": "Courbe exponentielle : très rapide juste après l'apprentissage, puis de plus en plus lente."}, {"recto": "Qu'est-ce que la répétition espacée ?", "verso": "Réviser à des intervalles de plus en plus grands, pour ralentir durablement l'oubli."}, {"recto": "Qu'est-ce que l'effet Dunning-Kruger ?", "verso": "Le décalage entre la compétence réelle d'une personne et la confiance qu'elle a en elle."}, {"recto": "Comment évolue la confiance au cours d'un apprentissage ?", "verso": "Elle grimpe vite (faux sentiment de maîtrise), chute (complexité perçue), puis remonte, justifiée."}, {"recto": "Quels sont les 5 « B » de la méthode ?", "verso": "Le Bon moment, le Bon lieu, la Bonne durée, le Bon nombre, la (les) Bonne(s) méthode(s)."}, {"recto": "Quel est le principe de la méthode Pomodoro ?", "verso": "25 min de travail concentré, 5 min de pause, répété 4 fois, puis une pause longue de 15-20 min."}, {"recto": "Comment fonctionne la technique de l'autotest ?", "verso": "Rédiger des questions le jour de l'apprentissage, y répondre sans le cours le lendemain, puis s'auto-évaluer."}, {"recto": "Pourquoi manipuler une information (schéma, carte mentale) aide-t-elle à la retenir ?", "verso": "La manipulation active rend l'information mémorable, contrairement à une lecture statique."}, {"recto": "Pourquoi chercher ses propres exemples, différents de ceux du cours, aide-t-il à apprendre ?", "verso": "Cela construit des repères personnels qui ancrent la notion dans du familier."}, {"recto": "Quel est le principe de la fiche studiométrique ?", "verso": "Répartir ses révisions dans le temps grâce à une grille qui indique, chaque jour, quelles notions revoir."}, {"recto": "Pourquoi les flashcards sont-elles efficaces pour mémoriser ?", "verso": "Elles combinent rappel actif et répétition espacée, tout en imposant le chunking (une notion à la fois)."}, {"recto": "Peut-on vraiment faire deux choses conscientes en même temps ?", "verso": "Non : le cerveau passe rapidement de l'une à l'autre, ce qui réduit la performance sur les deux."}, {"recto": "La lecture répétée est-elle la meilleure stratégie pour mémoriser à long terme ?", "verso": "Non : c'est l'une des moins efficaces ; se questionner sur le contenu fonctionne mieux."}];

(function () {
  const STORAGE_KEY = 'flashcards-progress-v1';

  const cardEl = document.getElementById('card');
  const rectoText = document.getElementById('rectoText');
  const versoText = document.getElementById('versoText');
  const masteredBadge = document.getElementById('masteredBadge');
  const progressLabel = document.getElementById('progressLabel');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');
  const countConnu = document.getElementById('countConnu');
  const countRevoir = document.getElementById('countRevoir');
  const countRestant = document.getElementById('countRestant');
  const liveAnnounce = document.getElementById('liveAnnounce');

  let order = CARDS_DATA.map((_, i) => i);
  let pos = 0;
  let flipped = false;
  let filterMode = false;
  let status = {}; // index -> 'connu' | 'revoir'

  function loadStatus() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
    return {};
  }
  function saveStatus() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(status)); } catch(e) {}
  }

  function activeOrder() {
    if (!filterMode) return order;
    return order.filter(i => status[i] === 'revoir');
  }

  function currentIndex() {
    const ao = activeOrder();
    if (ao.length === 0) return null;
    if (pos >= ao.length) pos = 0;
    return ao[pos];
  }

  function render() {
    const ao = activeOrder();
    if (ao.length === 0) {
      document.querySelector('.card-zone').style.display = 'none';
      document.querySelector('.assess-row').style.display = 'none';
      document.querySelector('.nav-row').style.display = 'none';
      progressLabel.textContent = filterMode ? 'Aucune carte à revoir 🎉' : 'Aucune carte';
      updateStats();
      return;
    }
    document.querySelector('.card-zone').style.display = '';
    document.querySelector('.assess-row').style.display = '';
    document.querySelector('.nav-row').style.display = '';

    const idx = currentIndex();
    const c = CARDS_DATA[idx];
    rectoText.textContent = c.recto;
    versoText.textContent = c.verso;
    cardEl.classList.toggle('flipped', flipped);
    masteredBadge.textContent = status[idx] === 'connu' ? '✅' : (status[idx] === 'revoir' ? '🔁' : '');

    progressLabel.textContent = `Carte ${pos + 1}/${ao.length}`;
    document.getElementById('prevBtn').disabled = pos === 0;
    document.getElementById('nextBtn').disabled = pos === ao.length - 1;

    updateStats();
    liveAnnounce.textContent = `Carte ${pos + 1} sur ${ao.length}. ${flipped ? 'Réponse affichée.' : 'Question affichée.'}`;
  }

  function updateStats() {
    const total = CARDS_DATA.length;
    let connu = 0, revoir = 0;
    Object.values(status).forEach(s => { if (s === 'connu') connu++; else if (s === 'revoir') revoir++; });
    const restant = total - connu - revoir;
    countConnu.textContent = connu;
    countRevoir.textContent = revoir;
    countRestant.textContent = restant;
    const pct = Math.round((connu / total) * 100);
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  function flip() {
    flipped = !flipped;
    cardEl.classList.toggle('flipped', flipped);
    liveAnnounce.textContent = flipped ? 'Réponse affichée.' : 'Question affichée.';
  }

  function goTo(newPos) {
    const ao = activeOrder();
    if (newPos < 0 || newPos >= ao.length) return;
    pos = newPos;
    flipped = false;
    render();
  }

  function mark(value) {
    const idx = currentIndex();
    if (idx === null) return;
    status[idx] = value;
    saveStatus();
    const ao = activeOrder();
    if (pos < ao.length - 1 || !filterMode) {
      setTimeout(() => goTo(Math.min(pos + (filterMode ? 0 : 1), activeOrder().length - 1)), 150);
    } else {
      render();
    }
  }

  cardEl.addEventListener('click', flip);
  cardEl.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  });
  document.getElementById('flipBtn').addEventListener('click', flip);
  document.getElementById('prevBtn').addEventListener('click', () => goTo(pos - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(pos + 1));
  document.getElementById('btnRevoir').addEventListener('click', () => mark('revoir'));
  document.getElementById('btnConnu').addEventListener('click', () => mark('connu'));

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0; flipped = false; render();
  });

  document.getElementById('filterBtn').addEventListener('click', function () {
    filterMode = !filterMode;
    this.classList.toggle('active', filterMode);
    pos = 0; flipped = false; render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Réinitialiser toute votre progression sur les 23 cartes ?')) return;
    status = {};
    saveStatus();
    filterMode = false;
    document.getElementById('filterBtn').classList.remove('active');
    pos = 0; flipped = false; render();
  });

  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'BUTTON' && e.key === 'Enter') return;
    if (e.key === 'ArrowRight') goTo(pos + 1);
    if (e.key === 'ArrowLeft') goTo(pos - 1);
  });

  // vue imprimable : toutes les cartes recto/verso
  const printAll = document.getElementById('printAll');
  let printHtml = '<h1 style="text-align:center;color:#1F3864;">Mes flashcards</h1>';
  CARDS_DATA.forEach((c, i) => {
    printHtml += `<div style="border:1px solid #999;border-radius:10px;padding:14px 18px;margin-bottom:12px;">
      <div style="font-weight:700;color:#1F3864;">${i+1}. ${c.recto}</div>
      <div style="color:#333;margin-top:6px;">${c.verso}</div>
    </div>`;
  });
  printAll.innerHTML = printHtml;

  // init
  status = loadStatus();
  render();
})();
</script>

</body>
</html>
